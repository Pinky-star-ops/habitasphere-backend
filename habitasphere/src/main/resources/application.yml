server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/habitasphere_db
    username: postgres
    password: Pinky

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.habitasphere.security: DEBUG
    com.habitasphere.config.SecurityConfig: DEBUG

file:
  upload-dir: uploads/documents